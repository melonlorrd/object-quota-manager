apiVersion: v1
kind: Pod
metadata:
  name: fd-under
  namespace: quota-e2e
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: busybox
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 10); do
            eval "exec $((i + 100))>/dev/null" 2>/dev/null
          done
          echo "opened 10 FDs, surviving"
          sleep 30
---
apiVersion: v1
kind: Pod
metadata:
  name: fd-over
  namespace: quota-e2e
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: busybox
      command:
        - sh
        - -c
        - |
          sleep 5
          for i in $(seq 1 100); do
            eval "exec $((i + 100))>/dev/null" 2>/dev/null
          done
          echo "survived"
          sleep 5
---
apiVersion: v1
kind: Pod
metadata:
  name: proc-under
  namespace: quota-e2e
spec:
  restartPolicy: Never
  containers:
    - name: fork-stress
      image: busybox
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 5); do
            (sleep 30) &
          done
          echo "spawned 5 processes, surviving"
          sleep 30
---
apiVersion: v1
kind: Pod
metadata:
  name: proc-over
  namespace: quota-e2e
spec:
